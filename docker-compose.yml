name: lms

networks:
  lms-network:
    driver: bridge

services:
  postgress:
    image: postgres:18-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    command: >+
      postgres -c max_connections=100 -c shared_buffers=256MB -c work_mem=8MB

    networks:
      - lms-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lms_user -d lms_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgbouncer 
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: lms-pgbouncer
    restart: unless-stopped
    depends_on:
      postgress:
        condition: service_healthy
    ports:
      - "6432:6432"
    networks:
      - lms-network
    environment:
      DB_HOST: postgress
      DB_PORT: 5432
      DB_USER: lms_user
      DB_PASSWORD: lms_password
      DB_NAME: lms_db
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 100
      ADMIN_USERS: postgres,lms_user
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "lms_user" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis 
  redis:
    image: redis:8.10-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lms-network
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Garage S3 Object Storage (Port 3900 S3 API, Port 3903 Admin)
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: lms-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    networks:
      - lms-network
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
  # S3 Visual Web Dashboard (~4MB RAM)
  s3-ui:
    image: cloudlena/s3manager:latest
    container_name: lms-s3-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENDPOINT=garage:3900
      - ACCESS_KEY_ID=GKa900698c09b15dc61fde6544
      - SECRET_ACCESS_KEY=9403c1996cffca765d2f147972f1a519fefa1e9d1f3d818c3547d150b7023f76
      - REGION=garage
      - USE_SSL=false
    networks:
      - lms-network

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  garage_meta:
  garage_data:

